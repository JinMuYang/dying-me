<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="dark" name="color-scheme">
    <meta name="theme-color" content="#000000">
    <title>Dying Me</title>
    <meta property="og:title" content="Dying Me">
    <meta property="og:description"
        content="A visual, existential breakdown of your life in months. There really is no time to waste.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dyingme.com">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="layout">
        <main>
            <header>
                <h1>Dying Me</h1>
                <a class="github-link" href="https://github.com/JinMuYang/dying-me" target="_blank"
                    title="View on GitHub" aria-label="GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor"
                            d="M10.303 16.652c-2.837-.344-4.835-2.385-4.835-5.028 0-1.074.387-2.235 1.031-3.008-.279-.709-.236-2.214.086-2.837.86-.107 2.02.344 2.708.967.816-.258 1.676-.386 2.728-.386 1.053 0 1.913.128 2.686.365.666-.602 1.848-1.053 2.708-.946.3.581.344 2.085.064 2.815.688.817 1.053 1.913 1.053 3.03 0 2.643-1.998 4.641-4.877 5.006.73.473 1.224 1.504 1.224 2.686v2.235c0 .644.537 1.01 1.182.752 3.889-1.483 6.94-5.372 6.94-10.185 0-6.081-4.942-11.044-11.022-11.044-6.081 0-10.98 4.963-10.98 11.044a10.84 10.84 0 0 0 7.112 10.206c.58.215 1.139-.172 1.139-.752v-1.719a2.768 2.768 0 0 1-1.032.215c-1.418 0-2.256-.773-2.857-2.213-.237-.58-.495-.924-.989-.988-.258-.022-.344-.129-.344-.258 0-.258.43-.451.86-.451.623 0 1.16.386 1.719 1.181.43.623.881.903 1.418.903.537 0 .881-.194 1.375-.688.365-.365.645-.687.903-.902Z">
                        </path>
                    </svg>
                </a>
            </header>

            <form id="base">
                <p>
                    <label for="birth-date">Birth Date:</label>
                    <input autofocus id="birth-date" required type="date">
                    <small>(no server-side database to store input data)</small>
                </p>
                <p>
                    <label for="life-expectancy">Life Expectancy:</label>
                    <input id="life-expectancy" min="0" placeholder="96" step="1" type="number" value="96">
                    <small>(years)</small>
                </p>
                <button type="submit">Generate Graph</button>
            </form>

            <ul class="hidden" id="legend">
                <li><span class="cell lived-expected"></span> month lived</li>
                <li><span class="cell unlived-expected"></span> month left</li>
                <li><span class="cell lived-unexpected"></span> month outlived</li>
            </ul>

            <div id="graph" aria-hidden="true"></div>
            <p id="info"></p>

            <div id="share-container" class="hidden">
                <button id="copy-link-btn" type="button">Copy Link to My Graph</button>
                <span id="copy-msg"
                    style="opacity: 0; transition: opacity 0.3s ease; font-size: 0.9rem; color: #4CAF50;">Copied!</span>
            </div>
        </main>

        <aside id="punchline-panel" class="hidden"><span id="punchline"></span></aside>
    </div>

    <script src="script.js"></script>
</body>

</html>
